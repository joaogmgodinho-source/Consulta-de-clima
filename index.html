<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Clima</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD700">
    <link rel="apple-touch-icon" href="./icons/icon-512x512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>

    <!-- um cabeçalho com o titulo do site -->
    <header>

        <h1>Climatte 🌧️</h1>


    </header>

    <!-- a parte principal do site, onde o usuário vai digitar o nome da cidade e consultar as informações dela -->
    <main>



        <h1>Consulta de Clima</h1>

        <h2>Digite o nome de uma cidade, e consulte as informações dela</h2>

        <div>

            <form action="">

                <label for="cidade"></label>
                <input type="text" placeholder="Digite a cidade" id="cidade">

                <button id="buscar" type="button">Buscar</button>

            </form>

        </div>

        <section id="resultado">
            <!-- O JavaScript colocará o resultado aqui -->
        </section>




    </main>

    <script src="script.js"></script>

</body>

</html>
